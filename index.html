/* Real persistence: localStorage works on any web host (unlike inside the Claude sandbox) */
const LS = {
  get(k, fb) {
    try {
      const v = localStorage.getItem("sfa_" + k);
      return v == null ? fb : JSON.parse(v);
    } catch {
      return fb;
    }
  },
  set(k, v) {
    try {
      localStorage.setItem("sfa_" + k, JSON.stringify(v));
    } catch {}
  },
  del(k) {
    try {
      localStorage.removeItem("sfa_" + k);
    } catch {}
  }
};
